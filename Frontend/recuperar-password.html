
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - TechStore</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-container">

        <!-- Lado izquierdo: Formulario -->
        <div class="login-form-section">
            <div class="form-wrapper">

                <!-- Logo -->
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24"
                             viewBox="0 0 24 24"
                             fill="none"
                             xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                fill="white"
                            />
                        </svg>
                    </div>
                    <span class="logo-text">[TU MARCA]</span>
                </div>

                <h1>Recuperar contraseña</h1>

                <p class="subtitle">
                    Ingresa tu correo electrónico y establece
                    una nueva contraseña para tu cuenta.
                </p>

                <form id="recuperarForm" novalidate>

                    <!-- Correo electrónico -->
                    <div class="form-group">
                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="nombre@correo.com"
                            autocomplete="email"
                        >
                    </div>

                    <!-- Nueva contraseña -->
                    <div class="form-group">
                        <label for="nuevaPassword">
                            Nueva contraseña
                        </label>

                        <input
                            type="password"
                            id="nuevaPassword"
                            name="nuevaPassword"
                            placeholder="Mínimo 6 caracteres"
                            autocomplete="new-password"
                        >
                    </div>

                    <!-- Confirmar contraseña -->
                    <div class="form-group">
                        <label for="confirmarPassword">
                            Confirmar nueva contraseña
                        </label>

                        <input
                            type="password"
                            id="confirmarPassword"
                            name="confirmarPassword"
                            placeholder="Repite la nueva contraseña"
                            autocomplete="new-password"
                        >
                    </div>

                    <!-- Mensajes de validación -->
                    <div
                        id="mensajeRecuperacion"
                        class="mensaje-recuperacion"
                        role="status"
                        aria-live="polite"
                        hidden>
                    </div>

                    <!-- Botón -->
                    <button
                        type="submit"
                        class="btn-primary"
                        id="btnRecuperar">
                        Cambiar contraseña
                    </button>

                </form>

                <p class="register-link">
                    ¿Recordaste tu contraseña?
                    <a href="/">Volver al inicio de sesión</a>
                </p>

            </div>
        </div>

        <!-- Lado derecho: Panel decorativo -->
        <div class="login-image-section">

            <div class="decorative-shapes">
                <div class="shape circle-1"></div>
                <div class="shape circle-2"></div>
                <div class="shape rounded-square"></div>
            </div>

            <div class="image-content">
                <h2>Todo tu trabajo, en un solo lugar.</h2>
                <p>[TU PROPUESTA DE VALOR EN UNA FRASE]</p>
            </div>

        </div>

    </div>

    <script>
        const formularioRecuperacion =
            document.getElementById('recuperarForm');

        const campoCorreo =
            document.getElementById('email');

        const campoNuevaPassword =
            document.getElementById('nuevaPassword');

        const campoConfirmarPassword =
            document.getElementById('confirmarPassword');

        const mensajeRecuperacion =
            document.getElementById('mensajeRecuperacion');

        const botonRecuperar =
            document.getElementById('btnRecuperar');

        let recuperacionCompletada = false;

        // Mostrar mensajes dentro del formulario
        function mostrarMensaje(texto, tipo = 'error') {
            mensajeRecuperacion.textContent = texto;
            mensajeRecuperacion.className =
                'mensaje-recuperacion ' + tipo;
            mensajeRecuperacion.hidden = false;
        }

        // Ocultar mensajes anteriores
        function ocultarMensaje() {
            if (recuperacionCompletada) {
                return;
            }

            mensajeRecuperacion.textContent = '';
            mensajeRecuperacion.hidden = true;
        }

        // Validar formato del correo
        function correoValido(correo) {
            const expresion = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return expresion.test(correo);
        }

        // Recuperar contraseña
        async function recuperarPassword(evento) {
            evento.preventDefault();

            if (recuperacionCompletada || botonRecuperar.disabled) {
                return;
            }

            const email = campoCorreo.value.trim();
            const nuevaPassword = campoNuevaPassword.value;
            const confirmarPassword = campoConfirmarPassword.value;

            ocultarMensaje();

            // Validar campos vacíos
            if (
                !email &&
                !nuevaPassword.trim() &&
                !confirmarPassword.trim()
            ) {
                mostrarMensaje('Todos los campos están vacíos.');
                return;
            }

            if (!email) {
                mostrarMensaje(
                    'El campo correo electrónico está vacío.'
                );
                return;
            }

            if (!nuevaPassword.trim()) {
                mostrarMensaje(
                    'El campo nueva contraseña está vacío.'
                );
                return;
            }

            if (!confirmarPassword.trim()) {
                mostrarMensaje(
                    'El campo confirmar contraseña está vacío.'
                );
                return;
            }

            // Validar correo
            if (!correoValido(email)) {
                mostrarMensaje(
                    'Ingrese un correo electrónico válido.'
                );
                return;
            }

            // Validar longitud
            if (nuevaPassword.length < 6) {
                mostrarMensaje(
                    'La contraseña debe tener al menos 6 caracteres.'
                );
                return;
            }

            // Comprobar que las contraseñas coincidan
            if (nuevaPassword !== confirmarPassword) {
                mostrarMensaje(
                    'Las contraseñas no coinciden.'
                );
                return;
            }

            botonRecuperar.disabled = true;
            botonRecuperar.textContent = 'Actualizando...';

            try {

                // Enviar datos al backend MVC
                const respuesta = await fetch(
                    '/api/recuperar-password',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email,
                            nuevaPassword
                        })
                    }
                );

                const resultado = await respuesta.json();

                // Contraseña actualizada correctamente
                if (respuesta.ok && resultado.success === true) {

                    recuperacionCompletada = true;

                    mostrarMensaje(
                        '¡Contraseña actualizada correctamente! Redirigiendo al inicio de sesión...',
                        'exito'
                    );

                    formularioRecuperacion.reset();

                    botonRecuperar.disabled = true;
                    botonRecuperar.textContent =
                        'Contraseña actualizada';

                    // Regresar al login después de 2 segundos
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);

                } else {

                    mostrarMensaje(
                        resultado.message ||
                        'No se pudo actualizar la contraseña.'
                    );
                }

            } catch (error) {

                console.error(
                    'Error al recuperar contraseña:',
                    error
                );

                mostrarMensaje(
                    'No se pudo conectar con el servidor.'
                );

            } finally {

                if (!recuperacionCompletada) {
                    botonRecuperar.disabled = false;
                    botonRecuperar.textContent =
                        'Cambiar contraseña';
                }
            }
        }

        // Escuchar el envío del formulario
        formularioRecuperacion.addEventListener(
            'submit',
            recuperarPassword
        );

        // Ocultar errores al modificar los campos
        campoCorreo.addEventListener('input', ocultarMensaje);

        campoNuevaPassword.addEventListener(
            'input',
            ocultarMensaje
        );

        campoConfirmarPassword.addEventListener(
            'input',
            ocultarMensaje
        );

    </script>

</body>
</html>
