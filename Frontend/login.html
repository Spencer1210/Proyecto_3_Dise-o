
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesión - TechStore</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Verificar si existe una sesión guardada -->
    <script>
        function verificarSesionExistente() {
            const datosGuardados =
                localStorage.getItem('usuarioTechStore') ||
                sessionStorage.getItem('usuarioTechStore');

            if (!datosGuardados) {
                return;
            }

            try {
                const usuario = JSON.parse(datosGuardados);

                if (
                    usuario &&
                    usuario.id != null &&
                    usuario.nombre &&
                    usuario.email
                ) {
                    window.location.replace(
                        '/pantalla-principal.html'
                    );
                } else {
                    localStorage.removeItem('usuarioTechStore');
                    sessionStorage.removeItem('usuarioTechStore');
                }

            } catch (error) {
                localStorage.removeItem('usuarioTechStore');
                sessionStorage.removeItem('usuarioTechStore');
            }
        }

        verificarSesionExistente();
    </script>
</head>

<body>

    <div class="login-container">

        <!-- Lado izquierdo: formulario -->
        <div class="login-form-section">
            <div class="form-wrapper">

                <!-- Encabezado centrado -->
                <div class="login-encabezado">
                    <h1>Inicia sesión</h1>

                    <p class="subtitle">
                        Bienvenido de nuevo. Ingresa tus datos para continuar.
                    </p>
                </div>

                <!-- Formulario -->
                <form id="loginForm" novalidate>

                    <!-- Correo electrónico -->
                    <div class="form-group">
                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="nombre@correo.com"
                            autocomplete="email"
                        >
                    </div>

                    <!-- Contraseña -->
                    <div class="form-group">

                        <div class="password-header">
                            <label for="password">
                                Contraseña
                            </label>

                            <a
                                href="/recuperar-password.html"
                                class="forgot-password">
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                        >
                    </div>

                    <!-- Mantener sesión iniciada -->
                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">

                            <input
                                type="checkbox"
                                id="remember"
                                name="remember"
                            >

                            <span class="checkmark"></span>
                            Mantener la sesión iniciada

                        </label>
                    </div>

                    <!-- Mensajes de error -->
                    <div
                        id="mensajeLogin"
                        class="mensaje-login"
                        role="alert"
                        aria-live="polite"
                        hidden>
                    </div>

                    <!-- Botón de ingreso -->
                    <button
                        type="submit"
                        class="btn-primary"
                        id="btnEntrar">
                        Iniciar sesión
                    </button>

                </form>

                <div class="divider">
                    <span>o</span>
                </div>

                <p class="register-link">
                    ¿No tienes cuenta?
                    <a href="/registro">Regístrate</a>
                </p>

            </div>
        </div>

        <!-- Lado derecho: panel morado -->
        <div class="login-image-section">

            <div class="decorative-shapes">
                <div class="shape circle-1"></div>
                <div class="shape circle-2"></div>
                <div class="shape rounded-square"></div>
            </div>

            <!-- Solo el logo -->
            <div class="image-content">
                <img
                    src="img/techstore-logo.png"
                    alt="TechStore"
                    class="techstore-logo-derecha"
                >
            </div>

        </div>

    </div>

    <script>

        const formularioLogin =
            document.getElementById('loginForm');

        const botonEntrar =
            document.getElementById('btnEntrar');

        const mensajeLogin =
            document.getElementById('mensajeLogin');

        const campoCorreo =
            document.getElementById('email');

        const campoPassword =
            document.getElementById('password');

        const mantenerSesion =
            document.getElementById('remember');

        // Mostrar mensaje de error
        function mostrarMensaje(texto) {
            mensajeLogin.textContent = texto;
            mensajeLogin.hidden = false;
        }

        // Ocultar mensaje
        function ocultarMensaje() {
            mensajeLogin.textContent = '';
            mensajeLogin.hidden = true;
        }

        // Validar formato del correo
        function correoValido(correo) {
            const expresion = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return expresion.test(correo);
        }

        // Iniciar sesión
        async function iniciarSesion() {

            const email = campoCorreo.value.trim();
            const password = campoPassword.value;

            ocultarMensaje();

            // Ambos campos vacíos
            if (!email && !password.trim()) {
                mostrarMensaje(
                    'Los campos correo electrónico y contraseña están vacíos.'
                );
                return;
            }

            // Correo vacío
            if (!email) {
                mostrarMensaje(
                    'El campo correo electrónico está vacío.'
                );
                return;
            }

            // Contraseña vacía
            if (!password.trim()) {
                mostrarMensaje(
                    'El campo contraseña está vacío.'
                );
                return;
            }

            // Correo inválido
            if (!correoValido(email)) {
                mostrarMensaje(
                    'Ingrese un correo electrónico válido.'
                );
                return;
            }

            botonEntrar.disabled = true;
            botonEntrar.textContent = 'Verificando...';

            try {

                // Conexión con el backend
                const respuesta = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const resultado = await respuesta.json();

                if (
                    respuesta.ok &&
                    resultado.success === true
                ) {

                    const usuario = resultado.usuario;

                    // Guardar solamente datos públicos
                    const datosSesion = JSON.stringify({
                        id: usuario.id,
                        nombre: usuario.nombre,
                        email: usuario.email
                    });

                    // Eliminar sesiones anteriores
                    localStorage.removeItem('usuarioTechStore');
                    sessionStorage.removeItem('usuarioTechStore');

                    if (mantenerSesion.checked) {

                        // Sesión persistente
                        localStorage.setItem(
                            'usuarioTechStore',
                            datosSesion
                        );

                    } else {

                        // Sesión de la pestaña
                        sessionStorage.setItem(
                            'usuarioTechStore',
                            datosSesion
                        );
                    }

                    // Ir a la tienda
                    window.location.href =
                        '/pantalla-principal.html';

                } else {

                    mostrarMensaje(
                        resultado.message ||
                        'Correo o contraseña incorrectos.'
                    );
                }

            } catch (error) {

                console.error(
                    'Error al iniciar sesión:',
                    error
                );

                mostrarMensaje(
                    'No se pudo conectar con el servidor.'
                );

            } finally {

                botonEntrar.disabled = false;
                botonEntrar.textContent = 'Iniciar sesión';

            }
        }

        // Enviar formulario
        formularioLogin.addEventListener(
            'submit',
            function(evento) {
                evento.preventDefault();
                iniciarSesion();
            }
        );

        // Ocultar errores al escribir
        campoCorreo.addEventListener(
            'input',
            ocultarMensaje
        );

        campoPassword.addEventListener(
            'input',
            ocultarMensaje
        );

    </script>

</body>
</html>
