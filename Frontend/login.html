<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <!-- Lado izquierdo: Formulario -->
        <div class="login-form-section">
            <div class="form-wrapper">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="white"/>
                        </svg>
                    </div>
                    <span class="logo-text">[TU MARCA]</span>
                </div>

                <h1>Inicia sesión</h1>
                <p class="subtitle">Bienvenido de nuevo. Ingresa tus datos para continuar.</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="nombre@correo.com">
                    </div>

                    <div class="form-group">
                        <div class="password-header">
                            <label for="password">Contraseña</label>
                            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                        </div>
                        <input type="password" id="password" name="password" placeholder="••••••••">
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember" name="remember">
                            <span class="checkmark"></span>
                            Mantener la sesión iniciada
                        </label>
                    </div>

                    <button type="button" class="btn-primary" id="btnEntrar">Iniciar sesión</button>
                </form>

                <div class="divider">
                    <span>o</span>
                </div>

                <p class="register-link">
                    ¿No tienes cuenta? <a href="/registro">Regístrate</a>
                </p>
            </div>
        </div>

        <!-- Lado derecho: Panel decorativo -->
        <div class="login-image-section">
            <div class="decorative-shapes">
                <div class="shape circle-1"></div>
                <div class="shape circle-2"></div>
                <div class="shape rounded-square"></div>
            </div>
            <div class="image-content">
                <h2>Todo tu trabajo, en un solo lugar.</h2>
            </div>
        </div>
    </div>

    <script>
        // Botón que manda directo a la pantalla principal sin validar
        document.getElementById('btnEntrar').addEventListener('click', function() {
            window.location.href = '/pantalla-principal.html';
        });
    </script>
</body>
</html>
