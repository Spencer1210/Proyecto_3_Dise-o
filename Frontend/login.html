
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesión - TechStore</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-container">

        <!-- Lado izquierdo: Formulario -->
        <div class="login-form-section">
            <div class="form-wrapper">

                <!-- Logo -->
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24"
                             viewBox="0 0 24 24"
                             fill="none"
                             xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                fill="white"
                            />
                        </svg>
                    </div>
                    <span class="logo-text">[TU MARCA]</span>
                </div>

                <h1>Inicia sesión</h1>

                <p class="subtitle">
                    Bienvenido de nuevo. Ingresa tus datos para continuar.
                </p>

                <!-- Formulario de inicio de sesión -->
                <form id="loginForm" novalidate>

                    <!-- Correo electrónico -->
                    <div class="form-group">
                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="nombre@correo.com"
                            autocomplete="email"
                        >
                    </div>

                    <!-- Contraseña -->
                    <div class="form-group">

                        <div class="password-header">
                            <label for="password">
                                Contraseña
                            </label>

                            <a
                                href="/recuperar-password.html"
                                class="forgot-password">
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                        >
                    </div>

                    <!-- Mantener sesión iniciada -->
                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">

                            <input
                                type="checkbox"
                                id="remember"
                                name="remember"
                            >

                            <span class="checkmark"></span>
                            Mantener la sesión iniciada

                        </label>
                    </div>

                    <!-- Mensaje dentro del formulario -->
                    <div
                        id="mensajeLogin"
                        class="mensaje-login"
                        role="alert"
                        aria-live="polite"
                        hidden>
                    </div>

                    <!-- Botón de inicio de sesión -->
                    <button
                        type="submit"
                        class="btn-primary"
                        id="btnEntrar">
                        Iniciar sesión
                    </button>

                </form>

                <div class="divider">
                    <span>o</span>
                </div>

                <!-- Registro -->
                <p class="register-link">
                    ¿No tienes cuenta?
                    <a href="/registro">Regístrate</a>
                </p>

            </div>
        </div>

        <!-- Lado derecho: Panel decorativo -->
        <div class="login-image-section">

            <div class="decorative-shapes">
                <div class="shape circle-1"></div>
                <div class="shape circle-2"></div>
                <div class="shape rounded-square"></div>
            </div>

            <div class="image-content">
                <h2>Todo tu trabajo, en un solo lugar.</h2>
                <p>[TU PROPUESTA DE VALOR EN UNA FRASE]</p>
            </div>

        </div>

    </div>

    <script>
        const formularioLogin =
            document.getElementById('loginForm');

        const botonEntrar =
            document.getElementById('btnEntrar');

        const mensajeLogin =
            document.getElementById('mensajeLogin');

        const campoCorreo =
            document.getElementById('email');

        const campoPassword =
            document.getElementById('password');

        // NUEVO: Casilla para mantener la sesión
        const mantenerSesion =
            document.getElementById('remember');

        // Mostrar mensaje de error
        function mostrarMensaje(texto) {
            mensajeLogin.textContent = texto;
            mensajeLogin.hidden = false;
        }

        // Ocultar mensaje de error
        function ocultarMensaje() {
            mensajeLogin.textContent = '';
            mensajeLogin.hidden = true;
        }

        // Validar formato del correo
        function correoValido(correo) {
            const expresion = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return expresion.test(correo);
        }

        // Función principal de inicio de sesión
        async function iniciarSesion() {

            const email = campoCorreo.value.trim();
            const password = campoPassword.value;

            ocultarMensaje();

            // Validar ambos campos vacíos
            if (!email && !password.trim()) {
                mostrarMensaje(
                    'Los campos correo electrónico y contraseña están vacíos.'
                );
                return;
            }

            // Validar correo vacío
            if (!email) {
                mostrarMensaje(
                    'El campo correo electrónico está vacío.'
                );
                return;
            }

            // Validar contraseña vacía
            if (!password.trim()) {
                mostrarMensaje(
                    'El campo contraseña está vacío.'
                );
                return;
            }

            // Validar formato del correo
            if (!correoValido(email)) {
                mostrarMensaje(
                    'Ingrese un correo electrónico válido.'
                );
                return;
            }

            // Desactivar botón mientras se verifica
            botonEntrar.disabled = true;
            botonEntrar.textContent = 'Verificando...';

            try {

                // Verificar credenciales con el backend MVC
                const respuesta = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const resultado = await respuesta.json();

                if (respuesta.ok && resultado.success === true) {

                    // NUEVO: Guardar los datos públicos del usuario
                    const usuario = resultado.usuario;

                    const datosSesion = JSON.stringify({
                        id: usuario.id,
                        nombre: usuario.nombre,
                        email: usuario.email
                    });

                    // Limpiar sesiones anteriores
                    localStorage.removeItem('usuarioTechStore');
                    sessionStorage.removeItem('usuarioTechStore');

                    if (mantenerSesion.checked) {

                        // Mantener datos al cerrar el navegador
                        localStorage.setItem(
                            'usuarioTechStore',
                            datosSesion
                        );

                    } else {

                        // Mantener datos solo en esta pestaña
                        sessionStorage.setItem(
                            'usuarioTechStore',
                            datosSesion
                        );
                    }

                    // Entrar al menú principal
                    window.location.href =
                        '/pantalla-principal.html';

                } else {

                    mostrarMensaje(
                        resultado.message ||
                        'Correo o contraseña incorrectos.'
                    );
                }

            } catch (error) {

                console.error(
                    'Error al iniciar sesión:',
                    error
                );

                mostrarMensaje(
                    'No se pudo conectar con el servidor.'
                );

            } finally {

                botonEntrar.disabled = false;
                botonEntrar.textContent = 'Iniciar sesión';

            }
        }

        // Iniciar sesión al presionar botón o Enter
        formularioLogin.addEventListener(
            'submit',
            function(evento) {
                evento.preventDefault();
                iniciarSesion();
            }
        );

        // Ocultar errores cuando el usuario escribe
        campoCorreo.addEventListener(
            'input',
            ocultarMensaje
        );

        campoPassword.addEventListener(
            'input',
            ocultarMensaje
        );

    </script>

</body>
</html>
