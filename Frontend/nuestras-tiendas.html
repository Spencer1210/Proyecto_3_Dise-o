
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestras tiendas - TechStore</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="tiendas-page">

    <!-- Encabezado compartido -->
    <div id="header-techstore"></div>

    <!-- Título y filtros -->
    <section class="tiendas-intro">
        <div class="tiendas-contenedor">
            <h1>Encuentra tu tienda más cercana</h1>

            <p>
                Consulta nuestras sucursales por provincia.
            </p>

            <div class="tiendas-filtros" id="filtrosProvincias">
                <button class="filtro-tienda activo" data-provincia="Todas">
                    Todas
                </button>

                <button class="filtro-tienda" data-provincia="Alajuela">
                    Alajuela
                </button>

                <button class="filtro-tienda" data-provincia="Cartago">
                    Cartago
                </button>

                <button class="filtro-tienda" data-provincia="Heredia">
                    Heredia
                </button>

                <button class="filtro-tienda" data-provincia="San José">
                    San José
                </button>

                <button class="filtro-tienda" data-provincia="Guanacaste">
                    Guanacaste
                </button>

                <button class="filtro-tienda" data-provincia="Limón">
                    Limón
                </button>

                <button class="filtro-tienda" data-provincia="Puntarenas">
                    Puntarenas
                </button>
            </div>
        </div>
    </section>

    <!-- Sucursales y mapa -->
    <main class="tiendas-contenedor tiendas-layout">

        <section class="tiendas-listado">
            <div id="listaSucursales"></div>
        </section>

        <section class="tiendas-mapa">
            <div class="mapa-interior">

                <img
                    src="img/mapa-costa-rica.png"
                    alt="Mapa de Costa Rica"
                    class="mapa-costa-rica"
                >

                <div id="marcadoresMapa"></div>
            </div>

            <p class="mapa-aviso">
                Ubicaciones ilustrativas. Pendiente confirmar
                las direcciones de las sucursales.
            </p>
        </section>

    </main>

    <!-- Pie de página -->
    <footer class="tiendas-footer">
        <p>© TechStore. Todos los derechos reservados.</p>
    </footer>

    <script src="/header.js"></script>

    <script>
        const sucursales = [
            {
                id: 1,
                nombre: "Tienda Alajuela",
                provincia: "Alajuela",
                x: 45,
                y: 25
            },
            {
                id: 2,
                nombre: "Tienda Cartago",
                provincia: "Cartago",
                x: 61,
                y: 46
            },
            {
                id: 3,
                nombre: "Tienda Heredia",
                provincia: "Heredia",
                x: 56,
                y: 27
            },
            {
                id: 4,
                nombre: "Tienda San José",
                provincia: "San José",
                x: 50,
                y: 46
            },
            {
                id: 5,
                nombre: "Tienda Guanacaste",
                provincia: "Guanacaste",
                x: 30,
                y: 28
            },
            {
                id: 6,
                nombre: "Tienda Limón",
                provincia: "Limón",
                x: 80,
                y: 48
            },
            {
                id: 7,
                nombre: "Tienda Puntarenas",
                provincia: "Puntarenas",
                x: 80,
                y: 70
            }
        ];

        let provinciaSeleccionada = "Todas";
        let sucursalSeleccionada = 1;

        const lista = document.getElementById("listaSucursales");
        const marcadores = document.getElementById("marcadoresMapa");
        const filtros = document.getElementById("filtrosProvincias");

        function obtenerSucursalesVisibles() {
            if (provinciaSeleccionada === "Todas") {
                return sucursales;
            }

            return sucursales.filter(
                sucursal =>
                    sucursal.provincia === provinciaSeleccionada
            );
        }

        function seleccionarSucursal(id) {
            sucursalSeleccionada = id;
            renderizarSucursales();
        }

        function renderizarSucursales() {
            const visibles = obtenerSucursalesVisibles();

            lista.innerHTML = "";
            marcadores.innerHTML = "";

            if (visibles.length === 0) {
                lista.textContent = "No hay sucursales disponibles.";
                return;
            }

            visibles.forEach(sucursal => {

                const tarjeta = document.createElement("article");
                tarjeta.className = "tienda-tarjeta";

                if (sucursal.id === sucursalSeleccionada) {
                    tarjeta.classList.add("seleccionada");
                }

                const encabezado = document.createElement("div");
                encabezado.className = "tienda-tarjeta-encabezado";

                const numero = document.createElement("span");
                numero.className = "tienda-numero";
                numero.textContent = sucursal.id;

                const informacion = document.createElement("div");

                const nombre = document.createElement("h2");
                nombre.textContent = sucursal.nombre;

                const direccion = document.createElement("p");
                direccion.textContent =
                    "Dirección pendiente de confirmar";

                const horario = document.createElement("p");
                horario.textContent =
                    "Horario y teléfono pendientes";

                informacion.append(nombre, direccion, horario);
                encabezado.append(numero, informacion);

                const acciones = document.createElement("div");
                acciones.className = "tienda-acciones";

                const botonSeleccionar =
                    document.createElement("button");

                botonSeleccionar.className = "btn-tienda";
                botonSeleccionar.textContent = "Ver en mapa";

                botonSeleccionar.addEventListener("click", () => {
                    seleccionarSucursal(sucursal.id);
                });

                acciones.appendChild(botonSeleccionar);
                tarjeta.append(encabezado, acciones);
                lista.appendChild(tarjeta);

                // Marcador del mapa
                const marcador = document.createElement("button");

                marcador.className = "marcador-tienda";
                marcador.textContent = sucursal.id;
                marcador.style.left = sucursal.x + "%";
                marcador.style.top = sucursal.y + "%";
                marcador.title = sucursal.nombre;

                marcador.setAttribute(
                    "aria-label",
                    "Seleccionar " + sucursal.nombre
                );

                if (sucursal.id === sucursalSeleccionada) {
                    marcador.classList.add("seleccionado");
                }

                marcador.addEventListener("click", () => {
                    seleccionarSucursal(sucursal.id);
                });

                marcadores.appendChild(marcador);
            });
        }

        // Filtros de provincias
        filtros.addEventListener("click", function(evento) {
            const boton = evento.target.closest(".filtro-tienda");

            if (!boton) {
                return;
            }

            provinciaSeleccionada = boton.dataset.provincia;

            document.querySelectorAll(".filtro-tienda")
                .forEach(elemento => {
                    elemento.classList.remove("activo");
                });

            boton.classList.add("activo");

            const visibles = obtenerSucursalesVisibles();

            sucursalSeleccionada =
                visibles.length > 0 ? visibles[0].id : null;

            renderizarSucursales();
        });

        // Mostrar sucursales
        renderizarSucursales();
    </script>

</body>
</html>
