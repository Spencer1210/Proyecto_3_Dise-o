
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestras tiendas - TechStore</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/nuestras-tiendas.css">
</head>

<body class="tiendas-page">

    <div id="header-techstore"></div>

    <main class="tiendas-contenedor">

        <!-- Título -->
        <section class="tiendas-intro">
            <h1>Encuentra tu tienda más cercana</h1>
            <p>Conoce la ubicación de nuestras sucursales en Costa Rica.</p>
            <div class="tiendas-linea"></div>
        </section>

        <div class="tiendas-layout">

            <!-- Mapa -->
            <section class="tiendas-mapa">
                <div class="mapa-interior">
                    <img
                        src="/img/mapa-costa-rica.png"
                        alt="Mapa de Costa Rica"
                        class="mapa-costa-rica"
                    >
                    <div id="marcadoresMapa"></div>
                </div>

                <p class="mapa-aviso">
                    Ubicaciones aproximadas de demostración.
                </p>
            </section>

            <!-- Sucursales -->
            <section class="tiendas-listado">
                <h2>Nuestras sucursales</h2>
                <div id="listaSucursales"></div>
            </section>

        </div>
    </main>

    <footer class="tiendas-footer">
        <p>© TechStore. Todos los derechos reservados.</p>
    </footer>

    <script src="/header.js"></script>

    <script>
        // Datos de las sucursales
        const sucursales = [
            {
                id: 1,
                nombre: "TechStore San José",
                provincia: "San José",
                direccion: "Avenida Central, San José.",
                x: 50,
                y: 46
            },
            {
                id: 2,
                nombre: "TechStore Alajuela",
                provincia: "Alajuela",
                direccion: "Plaza Real, Alajuela.",
                x: 45,
                y: 25
            },
            {
                id: 3,
                nombre: "TechStore Cartago",
                provincia: "Cartago",
                direccion: "Diagonal al TEC, Cartago.",
                x: 61,
                y: 46
            },
            {
                id: 4,
                nombre: "TechStore Heredia",
                provincia: "Heredia",
                direccion: "Centro Comercial Oxígeno, Heredia.",
                x: 56,
                y: 27
            },
            {
                id: 5,
                nombre: "TechStore Guanacaste",
                provincia: "Guanacaste",
                direccion: "Liberia, frente al hospital.",
                x: 30,
                y: 28
            },
            {
                id: 6,
                nombre: "TechStore Limón",
                provincia: "Limón",
                direccion: "Avenida 2, Limón Centro.",
                x: 80,
                y: 48
            },
            {
                id: 7,
                nombre: "TechStore Puntarenas",
                provincia: "Puntarenas",
                direccion: "Paseo de las Brisas, Puntarenas.",
                x: 80,
                y: 70
            }
        ];

        let sucursalSeleccionada = 1;

        const lista = document.getElementById("listaSucursales");
        const marcadores = document.getElementById("marcadoresMapa");

        // Seleccionar sucursal
        function seleccionarSucursal(id) {
            sucursalSeleccionada = id;
            renderizarSucursales();
        }

        // Mostrar tarjetas y marcadores
        function renderizarSucursales() {
            lista.innerHTML = "";
            marcadores.innerHTML = "";

            sucursales.forEach(sucursal => {
                const tarjeta = document.createElement("button");
                tarjeta.type = "button";
                tarjeta.className = "tienda-tarjeta";

                if (sucursal.id === sucursalSeleccionada) {
                    tarjeta.classList.add("seleccionada");
                }

                const icono = document.createElement("span");
                icono.className = "tienda-icono";
                icono.setAttribute("aria-hidden", "true");

                icono.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 10h18l-2-6H5l-2 6Z"/>
                        <path d="M5 10v10h14V10"/>
                        <path d="M9 20v-6h6v6"/>
                        <path d="M3 10c0 2 3 3 4.5 1"/>
                        <path d="M7.5 11c1.5 2 3 2 4.5 0"/>
                        <path d="M12 11c1.5 2 3 2 4.5 0"/>
                        <path d="M16.5 11c1.5 2 4.5 1 4.5-1"/>
                    </svg>
                `;

                const informacion = document.createElement("div");
                informacion.className = "tienda-informacion";

                const nombre = document.createElement("h3");
                nombre.textContent = sucursal.nombre;

                const direccion = document.createElement("p");
                direccion.textContent = sucursal.direccion;

                informacion.append(nombre, direccion);

                // Número de la sucursal
                const numero = document.createElement("span");
                numero.className = "tienda-provincia";
                numero.textContent = sucursal.id;

                tarjeta.append(icono, informacion, numero);

                tarjeta.addEventListener("click", () => {
                    seleccionarSucursal(sucursal.id);
                });

                lista.appendChild(tarjeta);

                // Número en el mapa
                const marcador = document.createElement("button");
                marcador.type = "button";
                marcador.className = "marcador-tienda";
                marcador.textContent = sucursal.id;
                marcador.style.left = sucursal.x + "%";
                marcador.style.top = sucursal.y + "%";
                marcador.title = sucursal.nombre;

                marcador.setAttribute(
                    "aria-label",
                    "Seleccionar " + sucursal.nombre
                );

                if (sucursal.id === sucursalSeleccionada) {
                    marcador.classList.add("seleccionado");
                }

                marcador.addEventListener("click", () => {
                    seleccionarSucursal(sucursal.id);
                });

                marcadores.appendChild(marcador);
            });
        }

        renderizarSucursales();
    </script>

</body>
</html>
