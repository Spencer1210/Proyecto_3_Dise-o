<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regístrate</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <!-- Lado izquierdo: Formulario -->
        <div class="login-form-section">
            <div class="form-wrapper">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="white"/>
                        </svg>
                    </div>
                    <span class="logo-text">[TU MARCA]</span>
                </div>

                <h1>Regístrate</h1>
                <p class="subtitle">Crea tu cuenta para comenzar.</p>

                <form id="registroForm">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="nombre@correo.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn-primary">Registrarme</button>
                </form>

                <div class="divider">
                    <span>o</span>
                </div>

                <p class="register-link">
                    ¿Ya tienes cuenta? <a href="/">Inicia sesión</a>
                </p>
            </div>
        </div>

        <!-- Lado derecho: Panel decorativo -->
        <div class="login-image-section">
            <div class="decorative-shapes">
                <div class="shape circle-1"></div>
                <div class="shape circle-2"></div>
                <div class="shape rounded-square"></div>
            </div>
            <div class="image-content">
                <h2>Todo tu trabajo, en un solo lugar.</h2>
                <p>[TU PROPUESTA DE VALOR EN UNA FRASE]</p>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
